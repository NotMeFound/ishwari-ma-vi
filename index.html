<!doctype html>

  <head>
    <script>
      (function () {
        // Suppress benign Vite HMR WebSocket connection errors in cloud container/iframe environment
        var isViteWsError = function (err) {
          if (!err) return false;
          var msg = typeof err === 'string' ? err : err.message || err.reason || String(err);
          return (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('websocket') !== -1 ||
            msg.indexOf('failed to connect to websocket') !== -1 ||
            msg.indexOf('WebSocket closed without opened') !== -1
          );
        };

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            if (isViteWsError(event.reason)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );

        window.addEventListener(
          'error',
          function (event) {
            if (isViteWsError(event.error) || isViteWsError(event.message)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
